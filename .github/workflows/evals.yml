name: evals

# Runs the evaluation suite against the real model API and gates the results
# against baselines/ (docs/methodology.md, "CI gate"). It costs money, so it runs
# only on pull requests labelled `run-evals`, weekly on main, and on demand.

on:
  pull_request:
    types: [labeled, synchronize, reopened]
    paths:
      - "src/**"
      - "data/**"
      - "baselines/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/evals.yml"
  schedule:
    - cron: "0 6 * * 1"  # Mondays 06:00 UTC: detects drift in the model behind the API
  workflow_dispatch:
    inputs:
      model:
        description: "Model (a baseline must exist in baselines/)"
        default: "openai:gpt-5.4-mini"
      repeat:
        description: "Repeats per case"
        default: "1"

permissions:
  contents: read

concurrency:
  group: evals-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    # Pull requests: only with the label, and never from forks (no secrets for untrusted code).
    if: >-
      github.event_name != 'pull_request' || (
        contains(github.event.pull_request.labels.*.name, 'run-evals') &&
        github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYDANTIC_AI_NO_BANNER: "1"
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      MODEL: ${{ inputs.model || 'openai:gpt-5.4-mini' }}
      # Weekly runs use three repeats; pull requests one, plus rechecks of failures.
      REPEAT: ${{ inputs.repeat || (github.event_name == 'schedule' && '3') || '1' }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Check inputs
        run: |
          [[ "$MODEL" =~ ^[A-Za-z0-9:._-]+$ ]] || { echo "invalid model: $MODEL"; exit 1; }
          [[ "$REPEAT" =~ ^[1-5]$ ]] || { echo "repeat must be 1-5: $REPEAT"; exit 1; }
          [[ -n "$OPENAI_API_KEY" ]] || { echo "OPENAI_API_KEY secret is not set"; exit 1; }
          echo "BASELINE_STEM=baselines/${MODEL//[^A-Za-z0-9_.-]/_}" >> "$GITHUB_ENV"
      - name: Run the regression set
        run: >-
          uv run python -m eng_agent_evals.run_evals --dataset regression --model "$MODEL"
          --repeat "$REPEAT" --recheck-failures 2 --output-dir ci-results/regression
      - name: Run the hard set
        run: >-
          uv run python -m eng_agent_evals.run_evals --dataset hard --model "$MODEL"
          --repeat "$REPEAT" --recheck-failures 2 --output-dir ci-results/hard
      - name: Gate the regression set
        run: >-
          uv run python -m eng_agent_evals.gate check ci-results/regression/*.json
          "$BASELINE_STEM-regression.json" --summary-file "$GITHUB_STEP_SUMMARY"
      - name: Gate the hard set
        if: success() || failure()  # report both gates even if the first one fails
        run: >-
          uv run python -m eng_agent_evals.gate check ci-results/hard/*.json
          "$BASELINE_STEM-hard.json" --summary-file "$GITHUB_STEP_SUMMARY"
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results-${{ github.run_id }}
          path: ci-results/
          retention-days: 90
