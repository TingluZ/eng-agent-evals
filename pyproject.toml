[project]
name = "eng-agent-evals"
version = "0.1.0"
description = "Evaluating an LLM agent that answers pipe-flow and heat-transfer questions with tool calls"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-ai-slim[openai]>=2.0",
    "pydantic-evals>=2.0",
    "logfire>=5.0",
    "pint>=0.24",
]

[project.scripts]
ask = "eng_agent_evals.ask:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eng_agent_evals"]

[tool.pytest.ini_options]
testpaths = ["tests"]
